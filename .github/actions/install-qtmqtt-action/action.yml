name: Install QtMqtt
description: Installs QtMqtt
inputs:
  version:
    description: Version of QtMqtt to install
    required: true
  qt-dir:
    description: Directory where Qt is installed
    required: true
    default: ${{ runner.temp }}
  dir:
    description: Directory to install QtMqtt
    required: true
    default: ${{ github.workspace }}/libs/qtmqtt
runs:
  using: "composite"
  steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        repository: qt/qtmqtt
        ref: ${{ inputs.version }}
        path: ${{ inputs.dir }}

    - name: Debug - List Qt directory
      shell: bash
      run: |
        echo "Current directory: $(pwd)"
        echo "Input Qt directory: ${{ inputs.qt-dir }}"
        echo "Runner OS: ${{ runner.os }}"
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          QT_DIR=$(cygpath -u "${{ inputs.qt-dir }}")
          echo "Converted Qt directory (cygpath): $QT_DIR"
        else
          QT_DIR="${{ inputs.qt-dir }}"
        fi
        echo "Using Qt directory: $QT_DIR"
        ls -la "$QT_DIR/bin/" || echo "Failed to list bin directory"
        echo "Checking for qt-configure-module: $(ls -la "$QT_DIR/bin/qt-configure-module" 2>/dev/null || echo 'Not found')"

    - name: Configure
      id: configure
      shell: bash
      continue-on-error: true
      working-directory: ${{ inputs.dir }}
      run: |
        # Normalize paths for Windows
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          QT_DIR=$(cygpath -u "${{ inputs.qt-dir }}")
        else
          QT_DIR="${{ inputs.qt-dir }}"
        fi
        echo "Running: $QT_DIR/bin/qt-configure-module ."
        "$QT_DIR/bin/qt-configure-module" . || {
          echo "Failed to run qt-configure-module"
          exit 1
        }

    - name: Build
      working-directory: ${{ inputs.dir }}
      run: cmake --build .
      shell: bash

    - name: Install
      working-directory: ${{ inputs.dir }}
      run: cmake --install . --verbose
      shell: bash